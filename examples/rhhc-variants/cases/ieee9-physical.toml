# Study premise: solid grounding of screens and earth wires at both ends.
# This case assumes ideal transposition. The study omits cross-bonding.
model = "exact"
bound = "gaussian"
harmonics = {value = [5, 7, 11, 13], origin = "examples/rhhc/ieee30_robust.jl:32"}
epsilon = {value = 0.05, origin = "examples/shhc/pce_params.jl:20"}
posterior = {value = 1024, origin = "examples/rhhc/ieee30_robust.jl:83"}
f1 = {value = 50.0, origin = "examples/shhc/ieee30_scenarios.jl:40"} # Hz
box_names = ["theta_ACSR", "rho_steel_O230", "rho_EARTH", "mu_steel_O230", "rho_aluminium_ACSR", "lay_middle_ACSR", "lay_inner_ACSR", "ambient_O230", "diameter_O230", "d_aluminium_ACSR"]
network = {kind = "converted", file = "networks/ieee9.json"}
units = {value = [1, 2, 3], origin = "networks/ieee9.json:1, load table from networks/convert.jl, save_network"}
note = "Cardinal physical replacement on supplied routes, with LCM charging. Source transformer leakage, ratios and capacitances remain. Assumption: generator-side delta and grid-side grounded star, proposed Dy11 with solid grid neutral; vector groups are notes only. Source line rating 1000 MVA; physical rating follows the candidate study. Assumption: shared O230 mechanical inputs serve both transmission voltage levels."

[classes]
ohl = [1, 2, 3, 4, 5, 6] # `networks/ieee9.json:1`, length_m in the branch table


[ratings.Cardinal]
current_A = {value = 994.5173367327438, register = "ACSR.Cardinal.rating"}
source_MVA = {value = 1000.0, origin = "networks/ieee9.json branch rate_a on its baseMVA"}
conditions = "Candidate study IEEE738 reference weather; fixed current ceiling."

