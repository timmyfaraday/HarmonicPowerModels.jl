# Study premise: solid grounding of screens and earth wires at both ends.
# This case assumes ideal transposition. The study omits cross-bonding.
model = "exact"
bound = "gaussian"
harmonics = {value = [5, 7, 11, 13], origin = "cases/antwerp.toml:5"}
epsilon = {value = 0.05, origin = "examples/shhc/pce_params.jl:20"}
posterior = {value = 1024, origin = "cases/antwerp.toml:7"}
f1 = {value = 50.0, origin = "examples/shhc/ieee30_scenarios.jl:40"} # Hz
box_names = ["d_wire_U155", "rho_EARTH", "R20_U155", "rho_copper_U155", "t_ins_U155", "t_sc1_U155", "t_sc2_U155", "t_jkt_U155", "d_c_U155", "theta_U155", "eps_semicon_U155", "eps_U155"]
network = {kind = "matpower", file = "../shhc/data/medium_network_shhc.m"}
units = {value = [1, 2, 3, 4, 5, 6, 7], origin = "examples/shhc/data/medium_network_shhc.m:38-62,96-115; load order from PowerModels"}
note = "Candidate study U155-Cu1600 with source routes and LCM charging. Variant: the Milliken conductor becomes round compacted copper of equal DC resistance. Variant: cross-bonded screens become screens bonded and grounded at both ends. The source 300 MVA rating remains: 1390 A assumes cross-bonding and both-end bonds add circulating screen losses. Assumption: bedding and the aluminum barrier form an effective dielectric jacket; barrier conductivity is omitted. Source Yy0 and Yd11 transformer records, five reactors and two grid equivalents remain. Circuits have ideal transposition."

