principle = {value = "absolute equality", origin = "src/robust/cutting_set.jl:62, the default of solve_rhhc, as in the IEEE30 cases"}
note = "The box varies core resistance, XLPE permittivity, insulation thickness and earth resistivity. Screens are solidly grounded at both ends. The circuits use ideal transposition. This case omits cross-bonding and uses absolute equality."
box_names = ["kR_U33", "eps_U33", "kt_U33", "rho_earth"]
network = {kind = "matpower", file = "../rhhc/data/hello_world.m"}
model = "exact"
bound = "cantelli"
harmonics = {value = [5, 7, 11, 13], origin = "examples/rhhc/ieee30_lcm.jl:102"} # 1
units = {value = [1, 2, 3], origin = "examples/rhhc/data/hello_world.m:19-21; load order from PowerModels"} # 1
epsilon = {value = 0.05, origin = "examples/shhc/pce_params.jl:20"} # 1
posterior = {value = 1024, origin = "examples/rhhc/ieee30_lcm.jl:152"} # 1
temperature = {value = 20.0, register = "U33.op.theta"} # °C
f1 = {value = 50.0, origin = "examples/shhc/ieee30_scenarios.jl:40"} # Hz

[earth]
rho = {value = 100.0, register = "EARTH.rho"} # Ω·m
eps_r = {value = 10.0, register = "EARTH.eps"} # 1
binding = "rho_earth"

[box.kR_U33]
family = "U33"
coordinate = "kR"

[box.eps_U33]
family = "U33"
coordinate = "eps"

[box.kt_U33]
family = "U33"
coordinate = "kt"

[box.rho_earth]
scale = "log"
nominal = {value = 100.0, register = "EARTH.rho"} # Ω·m
lower = {value = 10.0, register = "EARTH.rho"} # Ω·m
upper = {value = 1000.0, register = "EARTH.rho"} # Ω·m

[bindings.U33]
kR = "kR_U33"
eps = "eps_U33"
kt = "kt_U33"

# The cable screens have solid ground connections at both ends. The circuits use ideal transposition.
[branches."2"]
spec = "U33-630"
formation = "trefoil"
origin = "data/register/README.md, hello-world assignments"

[branches."3"]
spec = "U33-630"
formation = "trefoil"
origin = "data/register/README.md, hello-world assignments"

[branches."4"]
spec = "Goat"
formation = "O33-H"
origin = "data/register/README.md, hello-world assignments"
