note = "Each screen and earthwire is solidly grounded, and every circuit is ideally transposed. Each physical input has one coordinate per family. The sweep admits an axis at a relative change of at least 0.001 at 50 or 650 Hz in any sequence z or y. Phase temperature is at least ambient, each metal uses its own temperature, and phase and earthwire sag follow their elastic thermal state equations. ACSR resistance follows the realized wires without a separate resistance factor. A radial projection reduces wire-diameter deviations to enforce EN 50182 diameter and mass limits, including lay increments. The outer lay ratio is capped by the inner ratio; sag uses the realized mass and metal area. The input domain remains a box, and the builder maps it to the feasible wire constructions."
