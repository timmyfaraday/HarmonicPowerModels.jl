# Study premise: solid grounding of screens and earth wires at both ends.
# This case assumes ideal transposition. The study omits cross-bonding.
model = "exact"
bound = "cantelli"
harmonics = {value = [5, 7, 11, 13], origin = "examples/rhhc/ieee30_robust.jl:32"}
epsilon = {value = 0.05, origin = "examples/shhc/pce_params.jl:20"}
posterior = {value = 1024, origin = "examples/rhhc/ieee30_robust.jl:83"}
f1 = {value = 50.0, origin = "examples/shhc/ieee30_scenarios.jl:40"} # Hz
box_names = ["d_wire_U36", "d_c_U36", "d_c_NYY", "R20_U11", "rho_copper_U11", "eps_jacket_NYY", "t_jkt_U36", "t_ins_U11", "t_ins_NYY", "eps_NYY", "t_sc2_U36", "d_wire_U11", "eps_semicon_U11", "t_jkt_NYY", "t_sc2_U11", "R20_U36", "rho_copper_U36", "t_sc1_U11", "t_ins_U36", "theta_NYY", "eps_semicon_U36", "eps_U36", "rho_EARTH", "t_sc1_U36", "R20_NYY", "d_c_U11", "t_jkt_U11", "theta_U11", "eps_U11", "theta_U36"]
network = {kind = "matpower", file = "../shhc/data/industrial_network_shhc.m"}
units = {value = [1, 2, 3, 4], origin = "examples/shhc/data/industrial_network_shhc.m:17-27,44-49; load order from PowerModels"}
note = "Candidate study cables with source routes and LCM charging. Variant: three unscreened copper PVC single cores in touching trefoil replace the LV multicore cable. Transformer source records retain Yd11, Yy0, Dy11 and Dz0. Screens have both-end solid grounding and circuits have ideal transposition. Assumption: fixed physical cable ratings; no thermal recalculation."

