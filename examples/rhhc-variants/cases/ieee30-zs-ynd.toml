# Tom Van Acker assumes a YNd step-up with delta on the machine side.
# Leakage is 0.12 pu on S = 0.2 times Ssc, with X/R = 40.
# Each network bus sees an impedance to earth through this step-up.
# The condensers at buses 11 and 13 are open behind branches 13 and 16.
[generators."1"]
xsc0 = {value = 0.03, origin = "assumption: 0.12 pu on 400 MVA, Ssc 2 GVA"} # pu
rsc0 = {value = 0.00075, origin = "assumption: X/R = 40"} # pu
[generators."2"]
xsc0 = {value = 0.03, origin = "assumption: 0.12 pu on 400 MVA, Ssc 2 GVA"} # pu
rsc0 = {value = 0.00075, origin = "assumption: X/R = 40"} # pu
[generators."3"]
xsc0 = {value = 0.3, origin = "assumption: 0.12 pu on 40 MVA, Ssc 200 MVA"} # pu
rsc0 = {value = 0.0075, origin = "assumption: X/R = 40"} # pu
[generators."4"]
xsc0 = {value = 0.3, origin = "assumption: 0.12 pu on 40 MVA, Ssc 200 MVA"} # pu
rsc0 = {value = 0.0075, origin = "assumption: X/R = 40"} # pu
[generators."5"]
