# Zero sequence of the generators: each machine behind a YNd step-up (delta on the
# machine side), i.e., an impedance to earth at its bus, 0.12 pu leakage on a rating
# S = 0.2·Ssc (subtransient reactance 0.2 pu), X/R = 40; the condensers at buses 11
# and 13 are behind their own step-ups (branches 13 and 16), so open.
[generators."1"]
xsc0 = {value = 0.03, origin = "assumption: 0.12 pu on 400 MVA, Ssc 2 GVA"} # pu
rsc0 = {value = 0.00075, origin = "assumption: X/R = 40"} # pu
[generators."2"]
xsc0 = {value = 0.03, origin = "assumption: 0.12 pu on 400 MVA, Ssc 2 GVA"} # pu
rsc0 = {value = 0.00075, origin = "assumption: X/R = 40"} # pu
[generators."3"]
xsc0 = {value = 0.3, origin = "assumption: 0.12 pu on 40 MVA, Ssc 200 MVA"} # pu
rsc0 = {value = 0.0075, origin = "assumption: X/R = 40"} # pu
[generators."4"]
xsc0 = {value = 0.3, origin = "assumption: 0.12 pu on 40 MVA, Ssc 200 MVA"} # pu
rsc0 = {value = 0.0075, origin = "assumption: X/R = 40"} # pu
[generators."5"]
zero_sequence_open = {value = true, origin = "condenser behind branch 13 (delta on 11 kV)"}
[generators."6"]
zero_sequence_open = {value = true, origin = "condenser behind branch 16 (delta on 11 kV)"}
