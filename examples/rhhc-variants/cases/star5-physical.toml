# Study premise: solid grounding of screens and earth wires at both ends.
# This case assumes ideal transposition. The study omits cross-bonding.
model = "exact"
bound = "gaussian"
harmonics = {value = [5, 7, 11, 13], origin = "examples/rhhc/ieee30_robust.jl:32"}
epsilon = {value = 0.05, origin = "examples/shhc/pce_params.jl:20"}
posterior = {value = 1024, origin = "examples/rhhc/ieee30_robust.jl:83"}
f1 = {value = 50.0, origin = "examples/shhc/ieee30_scenarios.jl:40"} # Hz
box_names = ["theta_ACSR", "rho_EARTH", "ambient_O132", "rho_aluminium_ACSR", "lay_middle_ACSR", "lay_inner_ACSR", "diameter_O132", "d_steel_ACSR", "rho_steel_O132", "mu_steel_O132", "d_aluminium_ACSR"]
network = {kind = "matpower", file = "../shhc/data/5node_test.m"}
units = {value = [1, 2, 3, 4], origin = "examples/shhc/data/5node_test.m:25-29,59-63; load order from PowerModels"}
note = "Falcon physical replacement with charging and shared inputs. O132-D supports, span, reference sag and earthwire are adopted study assumptions at 100 kV, without a surveyed tower. Mechanical constants and material intervals transferred to Falcon are analogies. Fitted routes are fixed. The candidate study supplies the fixed length and physical rating."

[classes]
ohl = [1, 2, 3, 4] # `examples/shhc/data/5node_test.m:25-29,59-63`

[routes.spoke]
length_m = {value = 513.8081286697541, register = "STAR5.length"}
source_X_ohm = {value = 0.2, origin = "5node_test.m: branch x=0.002 on 100 ohm base"}
origin = "Candidate study branch-candidates.csv Star5; fitted jointly to R and X"

[ratings.Falcon]
current_A = {value = 1372.8443238788311, register = "ACSR.Falcon.rating"}
source_MVA = {value = 100.0, origin = "examples/shhc/data/5node_test.m branch rateA"}
conditions = "Candidate study IEEE 738 reference conditions; fixed physical rating, not recomputed with the electrical box."

[branches."1"]
spec = "Falcon"
formation = "O132-D"
route = "spoke"
rating = "Falcon"
origin = "candidate study: Falcon on O132-D with GW-7x3.15"

[branches."2"]
spec = "Falcon"
formation = "O132-D"
route = "spoke"
rating = "Falcon"
origin = "candidate study: Falcon on O132-D with GW-7x3.15"

[branches."3"]
spec = "Falcon"
