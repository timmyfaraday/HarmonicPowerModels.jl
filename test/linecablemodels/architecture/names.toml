[modules.HarmonicPowerModelsLineCableModelsExt]
# circuit, problem, formulation: LCM `examples/cable_30kv_630mm2_trefoil.jl`.
# fortescue, matrix: LCM `v0.0.0:src/engine/transforms/fortescue.jl`.
# sequence, sequences: HPM `src/core/data.jl`, harmonic_sequence.
# lock: HPM `src/robust/threads.jl` and `Base.ReentrantLock`.
nouns = ["circuit", "fortescue", "sequence", "problem", "formulation", "sequences", "lock", "matrix"]
# HPM `src/core/data.jl`, harmonic_sequence.
qualifiers = ["zero", "positive", "negative"]
# tol: LCM `v0.0.0:src/engine/transforms/fortescue.jl`.
# f1: HPM `src/robust/network_model.jl`, ExactPiModel.
symbols = ["tol", "f1"]

[register.HarmonicPowerModelsLineCableModelsExt]
lifts = ["select"]

[register.HarmonicPowerModelsLineCableModelsExt.public]
Circuit = "a three-phase circuit of LCM served per sequence: the user's problem at a point and a frequency, the formulation built once, the Fortescue matrix and the table of its sequences"
Fortescue = "the generalized Fortescue transformation: the unitary N-point DFT matrix and the tolerance of its diagonal check"
AbstractSequence = "the abstract sequence of HPM's protocol"
ZeroSequence = "the zero sequence of HPM's protocol"
PositiveSequence = "the positive sequence of HPM's protocol"
NegativeSequence = "the negative sequence of HPM's protocol"
